version: "0.9.1"
description: >-
  A self-contained 3D renderer for embedded targets: a binary asset container,
  skeletal animation, tile binning, a software rasterizer and a 2D canvas.
  Header-only, with no third-party dependency of any kind.
url: "https://github.com/0015/a3d"
repository: "https://github.com/0015/a3d.git"
issues: "https://github.com/0015/a3d/issues"
documentation: "https://github.com/0015/a3d#readme"
license: "Apache-2.0"

# Every tag must match ^[A-Za-z0-9_-]{3,32}$ - the registry rejects "3d" for
# being two characters, which is only visible when a build validates the
# manifest.
tags:
  - 3d-graphics
  - renderer
  - rasterizer
  - graphics
  - gltf
  - animation
  - display

dependencies:
  idf: ">=5.0"

files:
  exclude:
    - "**/build/**"
    - "**/managed_components/**"
    - "**/.cache/**"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
    - "**/.DS_Store"
