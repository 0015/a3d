name=a3d
version=0.9.3
author=Eric Nam
maintainer=Eric Nam
sentence=A self-contained 3D renderer for embedded targets.
paragraph=Runtime asset loading from a binary container, skeletal animation, tile binning and a software rasterizer with texturing, Gouraud shading, specular, transparency, mipmaps and depth-aware 3D lines. Header-only, no third-party dependency. Measured on ESP32-P4, ESP32-S3 and ESP32-C6. For the fastest builds use the ESP-IDF component - the published benchmark tables were measured there, and the Arduino core's prebuilt configuration is slower.
category=Display
